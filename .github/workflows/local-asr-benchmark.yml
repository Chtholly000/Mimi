name: local-asr-benchmark
on:
  pull_request:
    paths:
      - 'tools/local-asr-benchmark/**'
      - '.github/workflows/local-asr-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'tools/local-asr-benchmark/**'
      - '.github/workflows/local-asr-benchmark.yml'
permissions:
  contents: read
jobs:
  tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check tools without downloading models or audio
        run: |
          python3 -B -m unittest discover -s tools/local-asr-benchmark -p 'test_*.py'
          python3 -m py_compile tools/local-asr-benchmark/*.py
          git diff --check
