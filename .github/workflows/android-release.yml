name: android-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

concurrency:
  group: mimi-android-release
  cancel-in-progress: false

jobs:
  release-apk:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release version and signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name; refusing to create a release without the fixed signing identity."
              exit 1
            fi
          done
          version="$(sed -n 's/^versionName=//p' android/version.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="android-v${version}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::Android tag and version.properties do not match.'
            exit 1
          fi
          echo "ANDROID_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test, lint and build release APK
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mimi-android-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash android/sign-release.sh
      - name: Publish independent Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$ANDROID_RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" != tag ]] && git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo '::error::Android tag already exists. Run from that tag or choose a new version.'
            exit 1
          fi
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            echo '::error::This Android release already exists; refusing to replace its assets. Bump the version for a new release.'
            exit 1
          fi
          gh release create "$tag" android/release/*.apk android/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --draft --title "mimi ${tag}" \
            --notes-file android/RELEASE_NOTES.md
          # Verify the uploaded bytes before immutable publication.
          gh release view "$tag" --json assets > "$RUNNER_TEMP/android-assets.json"
          python3 - "$RUNNER_TEMP/android-assets.json" <<'PY'
          import hashlib, json, pathlib, sys
          local = {p.name: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in pathlib.Path('android/release').iterdir() if p.is_file()}
          remote = {a['name']: a['digest'] for a in json.load(open(sys.argv[1]))['assets']}
          if local != remote:
              raise SystemExit('Uploaded Android assets do not match the verified build.')
          PY
          gh release edit "$tag" --draft=false --latest=false
