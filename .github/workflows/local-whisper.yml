name: Local Whisper adapter

on:
  pull_request:
    paths:
      - 'tools/local-whisper/**'
      - '.github/workflows/local-whisper.yml'
  push:
    branches: [main]
    paths:
      - 'tools/local-whisper/**'
      - '.github/workflows/local-whisper.yml'

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/local-whisper/requirements.txt
      - name: Isolated protocol, authentication, bounds and cancellation tests
        working-directory: tools/local-whisper
        run: python -m unittest -v test_bridge.py
      - name: Build Metal worker without downloading weights or running inference
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, pathlib, tarfile, tempfile
          path = pathlib.Path('tools/local-whisper/install.py').resolve()
          spec = importlib.util.spec_from_file_location('installer', path)
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          root = pathlib.Path(tempfile.gettempdir()) / 'mimi-whisper-ci'
          root.mkdir(exist_ok=True)
          archive = root / 'source.tar.gz'
          installer.download(f'https://github.com/ggml-org/whisper.cpp/archive/{installer.SOURCE_REV}.tar.gz', archive, installer.SOURCE_SHA)
          with tarfile.open(archive) as source:
              source.extractall(root, filter='data')
          import subprocess
          subprocess.run(['cmake', '-S', str(path.parent), '-B', str(root / 'build'), '-DCMAKE_BUILD_TYPE=Release', f'-DWHISPER_SOURCE={root / ("whisper.cpp-" + installer.SOURCE_REV)}'], check=True)
          subprocess.run(['cmake', '--build', str(root / 'build'), '--target', 'mimi-whisper-worker', '-j', '3'], check=True)
          PY
